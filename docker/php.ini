memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 36M
expose_php = Off

; Never print errors into the response: a warning emitted before Craft sends
; its headers turns a recoverable problem into a blank "headers already sent"
; page. Everything goes to the container log instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = Europe/London

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
