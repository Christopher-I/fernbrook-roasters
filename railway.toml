# Railway build and deploy configuration.
#
# The image is built from the Dockerfile in this repo rather than Nixpacks,
# because Craft needs nginx and PHP-FPM running together with a specific set
# of PHP extensions.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /health is answered by nginx directly, so the check passes as soon as the
# web server is up and does not depend on the database.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# Note: there is deliberately no preDeployCommand. Railway does not mount
# volumes during pre-deploy, and Craft's `craft up` needs the storage volume,
# so migrations and project config run from the container entrypoint instead.
